# ───────────────────────────────────────────────────────
# CONFIGURACIÓN TMUX - JLIMBHERT (LA QUE TENÍAS Y MEJORADA)
# ───────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════
# 🔑 TECLA LÍDER: Ctrl + a  (igual que acordamos)
# ═══════════════════════════════════════════════════════
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ═══════════════════════════════════════════════════════
# 🎨 COLORES (EXACTOS COMO LOS RECORDASTE)
# ═══════════════════════════════════════════════════════
# Barra de estado inferior: ROJO OSCURO
set -g status-style bg="#8B0000",fg="#ffffff"

# Ventana / Sección ACTIVA: Fondo GRIS OSCURO, Letras BLANCAS
setw -g window-status-current-style bg="#2a2a2a",fg="#ffffff",bold

# Ventanas inactivas: para que se vean bien
setw -g window-status-style bg="#440000",fg="#bbbbbb"

# Colores de bordes de paneles
set -g pane-border-style fg="#600000"
set -g pane-active-border-style fg="#ffffff"

# ═══════════════════════════════════════════════════════
# ⌨️ TUS TECLAS ORIGINALES (F2, F3, F7, F8, F9)
# ═══════════════════════════════════════════════════════
bind-key -n F2     next-window           # F2 → Avanzar sección
bind-key -n F3     previous-window        # F3 → Regresar sección
bind-key -n F7     new-window             # F7 → Nueva sección
bind-key -n F8     source-file ~/.tmux.conf \; display "✅ Configuración ACTUALIZADA!"  # F8 → Recargar
bind-key -n F9     kill-window            # F9 → Cerrar sección

# ═══════════════════════════════════════════════════════
# ⚙️ ACCIONES CON TECLA LÍDER (Ctrl+a → soltar → tecla)
# ═══════════════════════════════════════════════════════
bind | split-window -h    # Ctrl+a → |  → Dividir VERTICAL
bind - split-window -v    # Ctrl+a → -  → Dividir HORIZONTAL

bind , command-prompt -I "#W" "rename-window "%%" "      # Ctrl+a → ,  → Cambiar nombre de SECCIÓN
bind $ command-prompt -I "#S" "rename-session "%%" "    # Ctrl+a → $  → Cambiar nombre de SESIÓN PRINCIPAL

# ═══════════════════════════════════════════════════════
# 🚀 MEJORAS QUE AGREGAMOS (TODO CONFIRMADO)
# ═══════════════════════════════════════════════════════

# ✅ Ratón ACTIVADO (clic, arrastrar, deslizar historial)
set -g mouse on

# ✅ Numeración empieza en 1 (no en 0, más cómodo)
set -g base-index 1
setw -g pane-base-index 1

# ✅ Moverse entre paneles con Ctrl + Flechas
bind-key -n C-Left  select-pane -L
bind-key -n C-Right select-pane -R
bind-key -n C-Up    select-pane -U
bind-key -n C-Down  select-pane -D

# ✅ Copiar y pegar texto fácil
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ✅ Barra de información (muestra nombres, hora, fecha)
set -g status-left " 🖥️  #S "       # Nombre de la sesión
set -g status-right " 📅 %d-%m-%Y ⌚ %H:%M "
set -g status-interval 60

# ✅ Historial más grande para ver comandos antiguos
set -g history-limit 10000

# ✅ Teclas en modo vi (más cómodo para navegar)
setw -g mode-keys vi
